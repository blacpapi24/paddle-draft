<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9edf3">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0;-webkit-text-size-adjust:100%} img{max-width:100%}</style>
</head>
<body>
<title>Paddle Draft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an auction room on one device. A lot card sits centre stage, the
   bidder paddles sit beneath it, and each player's five-slot board sits below. */
:root {
  --bg: #e9edf3;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --ink: #15203a;
  --muted: #5b6680;
  --line: #d5dbe6;
  --accent: #e2522b;      /* the bidding paddle */
  --accent-ink: #ffffff;
  --gold: #b97c0c;        /* the hammer price */
  --good: #1f8a5b;
  --shadow: 0 1px 2px rgba(21,32,58,.06), 0 8px 24px rgba(21,32,58,.08);
  --p1: #e2522b; --p2: #2a6fdb; --p3: #1f8a5b; --p4: #8a4fd1; --p5: #c4398b; --p6: #b97c0c;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "DM Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #172036; --surface-2: #1d2842; --ink: #e8ecf5; --muted: #98a3bd;
    --line: #2a3654; --accent: #ff6a42; --accent-ink: #1a0d08; --gold: #f2b84b; --good: #3cc489;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --p1: #ff6a42; --p2: #5d97ff; --p3: #3cc489; --p4: #b388ff; --p5: #f06bb4; --p6: #f2b84b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #172036; --surface-2: #1d2842; --ink: #e8ecf5; --muted: #98a3bd;
  --line: #2a3654; --accent: #ff6a42; --accent-ink: #1a0d08; --gold: #f2b84b; --good: #3cc489;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --p1: #ff6a42; --p2: #5d97ff; --p3: #3cc489; --p4: #b388ff; --p5: #f06bb4; --p6: #f2b84b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.paddle-mark { width: 34px; height: 44px; position: relative; flex: none; }
.paddle-mark::before { content: ""; position: absolute; inset: 0 0 14px; background: var(--accent); border-radius: 50% 50% 46% 46%; }
.paddle-mark::after { content: ""; position: absolute; left: 14px; width: 6px; bottom: 0; height: 18px; background: var(--ink); border-radius: 3px; }
.brand h1 { font-size: 26px; font-weight: 800; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.ghost:hover { background: var(--surface); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }

/* ---------- setup ---------- */
.setup { display: grid; gap: 22px; }
.setup h2 { font-size: 22px; }
.field-row { display: grid; gap: 10px; }
.players-list { display: grid; gap: 8px; }
.player-input { display: flex; gap: 8px; align-items: center; }
.player-input .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
input[type=text], input[type=number], textarea {
  font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0;
}
textarea { min-height: 140px; resize: vertical; }
@media (pointer: coarse) { input[type=text], input[type=number], textarea { font-size: 16px; } }
.icon-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; width: 36px; height: 36px; flex: none; font-size: 18px; line-height: 1; }
.add-btn { justify-self: start; background: transparent; border: 1px dashed var(--line); color: var(--ink); border-radius: 10px; padding: 8px 14px; }
.genres { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.genre {
  text-align: left; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 14px; padding: 14px; display: grid; gap: 4px; transition: border-color .15s, transform .15s;
}
.genre:hover { border-color: var(--muted); }
.genre[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); box-shadow: inset 0 0 0 1px var(--accent); }
.genre strong { font-family: var(--f-display); font-size: 16px; font-weight: 700; }
.genre span { font-size: 12.5px; color: var(--muted); }
.rules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.rule { display: grid; gap: 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 3px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.primary {
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px;
  padding: 14px 22px; font-family: var(--f-display); font-weight: 700; font-size: 17px;
}
.primary:disabled { opacity: .45; cursor: not-allowed; }
.primary:not(:disabled):hover { filter: brightness(1.05); }
.error { color: var(--accent); font-size: 13.5px; min-height: 1em; margin: 0; }
.howto { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; max-width: 70ch; }

/* ---------- auction stage ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
.lot { position: relative; overflow: hidden; display: grid; gap: 18px; }
.lot-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.lot-title { font-size: clamp(28px, 5vw, 44px); font-weight: 800; line-height: 1.05; min-height: 1.1em; overflow-wrap: anywhere; }
.lot-sub { color: var(--muted); margin-top: 6px; font-size: 15px; }
.lot-title.spinning { color: var(--muted); }
.price-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.price { font-family: var(--f-mono); font-size: 54px; font-weight: 700; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.price.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.12); } }
.leader { text-align: right; }
.leader b { font-family: var(--f-display); font-size: 20px; }
.stamp {
  position: absolute; top: 16px; right: 18px; transform: rotate(8deg);
  border: 3px solid var(--good); color: var(--good); font-family: var(--f-display); font-weight: 800;
  padding: 4px 14px; border-radius: 8px; font-size: 22px; letter-spacing: .06em; background: var(--surface);
  animation: stamp .4s cubic-bezier(.2,1.6,.4,1);
}
.stamp.unsold { border-color: var(--muted); color: var(--muted); }
@keyframes stamp { from { transform: rotate(8deg) scale(2.2); opacity: 0; } }

.turn { display: grid; gap: 14px; }
.turn-who { display: flex; align-items: center; gap: 12px; }
.turn-who .paddle { width: 46px; height: 58px; position: relative; flex: none; }
.paddle::before { content: ""; position: absolute; inset: 0 0 18px; background: var(--pc); border-radius: 50% 50% 46% 46%; }
.paddle::after { content: ""; position: absolute; left: 20px; width: 6px; bottom: 0; height: 22px; background: var(--ink); border-radius: 3px; }
.paddle span { position: absolute; inset: 0 0 18px; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 16px; z-index: 1; }
.turn-who h2 { font-size: 24px; }
.turn-who p { margin: 0; color: var(--muted); font-size: 13.5px; }
.bid-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bid-btn {
  border: 0; border-radius: 12px; padding: 14px 8px; background: var(--pc, var(--accent)); color: #fff;
  font-family: var(--f-mono); font-weight: 700; font-size: 18px; display: grid; gap: 2px;
}
.bid-btn small { font-family: var(--f-body); font-weight: 500; font-size: 11.5px; opacity: .9; }
.bid-btn:disabled { opacity: .3; cursor: not-allowed; }
.custom-bid { display: flex; gap: 8px; }
.custom-bid input { flex: 1; }
.custom-bid button { border: 1.5px solid var(--pc, var(--accent)); color: var(--ink); background: transparent; border-radius: 10px; padding: 0 16px; font-weight: 700; }
.drop-btn { border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 12px; padding: 12px; font-weight: 700; }
.drop-btn:hover { border-color: var(--muted); }
.in-room { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--pc); }
.chip.out { opacity: .45; text-decoration: line-through; }
.chip.lead { border-color: var(--pc); box-shadow: inset 0 0 0 1px var(--pc); font-weight: 700; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.log { display: grid; gap: 4px; font-size: 13px; color: var(--muted); max-height: 140px; overflow: auto; margin: 0; padding: 0; list-style: none; }
.log li b { color: var(--ink); font-weight: 600; }

/* ---------- boards ---------- */
.boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; border-top: 4px solid var(--pc); }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.board-head h3 { font-size: 18px; overflow-wrap: anywhere; }
.wallet { font-family: var(--f-mono); font-weight: 700; font-size: 18px; color: var(--gold); white-space: nowrap; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: slot; }
.slot { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 14px; min-height: 40px; }
.slot::before { counter-increment: slot; content: counter(slot); font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.slot.empty { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.slot .t { overflow-wrap: anywhere; font-weight: 500; }
.slot .p { display: block; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; }
.slot .v { font-family: var(--f-mono); font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.board-total { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.board-total b { font-size: 22px; color: var(--pc); }
.board.champ { box-shadow: 0 0 0 2px var(--pc), var(--shadow); }
.crown { display: inline-block; vertical-align: middle; font-family: var(--f-body); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: 2px 8px; border-radius: 999px; background: var(--pc); color: #fff; }
.genre .wins { color: var(--ink); font-weight: 500; }
.lot-stat { margin-top: 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.lot-stat b { font-size: 15px; }
.vote-btn { border: 0; border-radius: 12px; padding: 12px 20px; background: var(--pc); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.slot.new { animation: flash 1.2s ease; }
@keyframes flash { 0% { background: var(--pc); color: #fff; } }
.board-foot { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }

.queue-strip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.qdot { width: 22px; height: 8px; border-radius: 4px; background: var(--line); }
.qdot.done { background: var(--muted); opacity: .5; }
.qdot.now { background: var(--accent); }

/* ---------- results ---------- */
.results-head { display: grid; gap: 6px; }
.results-head h2 { font-size: clamp(26px, 4vw, 36px); }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.award { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.award b { font-family: var(--f-display); font-size: 16px; }
.award span { font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }


/* ---------- home, lobby, online ---------- */
.home { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.mode-card { display: grid; gap: 10px; align-content: start; }
.mode-card h2 { font-size: 22px; }
.mode-card .primary { justify-self: start; }
.join-row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; }
.code-input { font-family: var(--f-mono) !important; font-weight: 700; font-size: 20px !important; letter-spacing: .2em; text-transform: uppercase; text-align: center; }
.lobby { display: grid; gap: 16px; }
.lobby h2 { font-size: 22px; }
.lobby-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.room-code { font-size: clamp(48px, 14vw, 84px); font-weight: 700; letter-spacing: .14em; line-height: 1; color: var(--accent); }
.lobby-genre { font-family: var(--f-display); font-size: 18px; }
.room-bar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.room-bar b { font-size: 16px; letter-spacing: .1em; }
.you { display: inline-block; vertical-align: middle; font-family: var(--f-body); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--pc); color: var(--ink); }
.waiting { display: flex; gap: 6px; padding: 8px 0; }
.waiting span { width: 10px; height: 10px; border-radius: 50%; background: var(--pc); animation: pulse 1.2s ease-in-out infinite; }
.waiting span:nth-child(2) { animation-delay: .2s; } .waiting span:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.source { margin: 0; font-size: 12.5px; color: var(--muted); }
.lan-rooms { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.lan-room { display: flex; align-items: baseline; gap: 12px; text-align: left; border: 1.5px solid var(--accent); background: var(--surface-2); color: var(--ink); border-radius: 12px; padding: 10px 14px; }
.lan-room b { font-size: 18px; letter-spacing: .12em; color: var(--accent); }
.lan-room span { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.lan-hint { text-align: center; }
[hidden] { display: none !important; }
.pair-wrap { position: fixed; inset: 0; background: rgba(10, 14, 26, .55); z-index: 30; display: grid; place-items: center; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); }
.pair-sheet { width: 100%; max-width: 440px; display: grid; gap: 14px; }
.pair-sheet h2 { font-size: 22px; }
.pair-head { display: flex; justify-content: space-between; align-items: center; }
.pair-step { display: flex; gap: 12px; align-items: flex-start; }
.pair-step p { margin: 0; }
.step { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.qr { background: #fff; border-radius: 12px; padding: 8px; width: min(100%, 320px); justify-self: center; }
.qr svg { display: block; width: 100%; height: auto; }
.cam { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; background: #000; }
.manual summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
.manual { display: grid; gap: 8px; }
.manual-row { display: flex; gap: 8px; margin-top: 8px; }
.manual-row input { flex: 1; font-family: var(--f-mono); font-size: 12px; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn.ok::before { background: var(--good); }
.conn.off::before { background: var(--accent); }
.pair-btn.ghost { padding: 6px 10px; }
.join-row.solo { grid-template-columns: 1fr; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: min(520px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); z-index: 20; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="paddle-mark" aria-hidden="true"></div>
      <div>
        <h1>Paddle Draft</h1>
        <p>Pick a genre. Bid for the top 10. Fill five slots.</p>
      </div>
    </div>
    <button class="ghost" id="restartBtn" hidden>New game</button>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="pair-wrap" id="pair" hidden></div>

<script>
/* ---------------- genre data ---------------- */

   Figures checked against public sources in November 2026. */

    ["Oppenheimer","2023",976],["Dune: Part Two","2024",715],["Everything Everywhere All at Once","2022",143],
    ["Top Gun: Maverick","2022",1496],["Spider-Man: No Way Home","2021",1921],["Barbie","2023",1447],
    ["Past Lives","2023",43],["The Batman","2022",773],["Inside Out 2","2024",1699],["Poor Things","2023",118] ]},
  { id: "films-2010s", name: "Movies of the 2010s", blurb: "The decade of Marvel and Parasite",
    stat: { label: "Worldwide box office", fmt: "usdm", source: "Box Office Mojo lifetime grosses, Nov 2026" }, items: [
    ["Parasite","2019",263],["Mad Max: Fury Road","2015",380],["The Social Network","2010",225],["Get Out","2017",256],
    ["Inception","2010",840],["Interstellar","2014",774],["Avengers: Endgame","2019",2799],["Whiplash","2014",50],
    ["La La Land","2016",509],["Moonlight","2016",67] ]},
  { id: "films-2000s", name: "Movies of the 2000s", blurb: "From Gladiator to Basterds",
    stat: { label: "Worldwide box office", fmt: "usdm", source: "Box Office Mojo lifetime grosses, Nov 2026" }, items: [
    ["The Dark Knight","2008",1008],["The Return of the King","2003",1149],["Spirited Away","2001",359],["Gladiator","2000",465],
    ["No Country for Old Men","2007",172],["There Will Be Blood","2007",76],["The Departed","2006",291],
    ["Finding Nemo","2003",942],["Inglourious Basterds","2009",321],["City of God","2002",31] ]},
  { id: "tv", name: "TV shows", blurb: "Prestige drama and great comedy",
    stat: { label: "IMDb rating", fmt: "rating", source: "IMDb user ratings, approximate" }, items: [
    ["Breaking Bad","2008–2013",9.5],["The Sopranos","1999–2007",9.2],["The Wire","2002–2008",9.3],

async function packSignal(obj) {
  const text = JSON.stringify(obj);
  if (window.CompressionStream) {
    const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
    return "Z" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  return "J" + btoa(unescape(encodeURIComponent(text))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function unpackSignal(s) {
  s = (s || "").trim();
  const kind = s[0], b64 = s.slice(1).replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
  if (kind === "J") return JSON.parse(decodeURIComponent(escape(bin)));
  if (kind !== "Z" || !window.DecompressionStream) throw new Error("bad code");
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

      const parts = l.split(/\s+[-–|]\s+/);
      const t = parts.shift();
      let value = null;
      if (parts.length && /^[\d.,]+$/.test(parts[parts.length - 1])) value = parseFloat(parts.pop().replace(/,/g, ""));
      return { title: t, sub: parts.join(" · "), value };
    });
    genreName = (setup.customName || "").trim() || "Custom list";
    stat = items.some(it => it.value != null) ? { label: (setup.customStat || "").trim() || "Score", fmt: "num" } : null;
  } else {
    items = g.items.map(([title, sub, value]) => ({ title, sub, value }));
    genreName = g.name;
    stat = g.stat;
  }
  const roster = NET ? S.members.map(m => ({ id: m.id, name: m.name })) : setup.names.map(n => ({ id: null, name: n }));
  const keep = NET ? { code: S.code, host: S.host, members: S.members } : {};
  S = {
    ...keep,
    phase: "reveal", setup, stat, showStats: setup.showStats,
    genre: genreName, budget: setup.budget, slots: setup.slots, reserve: setup.reserve, secondChance: setup.secondChance,
    players: roster.map((r, i) => ({ id: r.id, name: (r.name || "").trim() || `Player ${i + 1}`, color: PCOLORS[i], budget: setup.budget, picks: [] })),
    queue: shuffle(items).map(it => ({ ...it, passes: 0 })),
    pos: 0, opener: 0, lot: null, history: [], lastSold: null, vote: null,
  };
}

function openLot() {
  const item = S.queue[S.pos];
  const eligible = S.players.map((p, i) => i).filter(i => canStillBuy(S.players[i]));
  const first = firstOpener();
  S.opener = (S.opener + 1) % S.players.length;
  S.lot = { item, price: 0, leader: null, active: eligible, turn: eligible.includes(first) ? first : (eligible[0] ?? null), result: null, log: [] };
  S.phase = "auction";
  autoSkip();
}

function firstOpener() {
  const n = S.players.length;
  for (let k = 0; k < n; k++) { const i = (S.opener + k) % n; if (canStillBuy(S.players[i])) return i; }
  return 0;
}

function nextTurn(from) {
  const L = S.lot, n = S.players.length;
  for (let k = 1; k <= n; k++) {
    const i = (from + k) % n;
    if (L.active.includes(i) && i !== L.leader) return i;
  }
  return null;
}

// Players who cannot top the current price drop out automatically.
function autoSkip() {
  const L = S.lot;
  let guard = 0;
  while (L.turn !== null && guard++ < 20) {
    const p = S.players[L.turn];
    if (maxBid(p) > L.price) break;
    L.active = L.active.filter(i => i !== L.turn);
    L.log.unshift(`<b>${esc(p.name)}</b> can't go above ${money(L.price)} and drops out`);
    L.turn = nextTurn(L.turn);
  }
  checkHammer();
}

function checkHammer() {
  const L = S.lot;
  const others = L.active.filter(i => i !== L.leader);
  if (L.leader !== null && others.length === 0) return hammer(L.leader);
  if (L.leader === null && L.active.length === 0) return hammer(null);
}

function bid(amount) {
  const L = S.lot, p = S.players[L.turn];
  if (!(amount > L.price) || amount > maxBid(p)) return false;
  L.price = amount; L.leader = L.turn;
  L.log.unshift(`<b>${esc(p.name)}</b> bids ${money(amount)}`);
  L.turn = nextTurn(L.turn);
  if (L.turn === null) checkHammer(); else autoSkip();
}

function drop() {
  const L = S.lot, p = S.players[L.turn];
  L.active = L.active.filter(i => i !== L.turn);
  L.log.unshift(`<b>${esc(p.name)}</b> drops out`);
  L.turn = nextTurn(L.turn);
  if (L.turn === null) checkHammer(); else autoSkip();
}

function hammer(winner) {
  const L = S.lot;
  L.turn = null;
  if (winner === null) {
    L.result = { sold: false };
    L.item.passes = (L.item.passes || 0) + 1;
    if (S.secondChance && L.item.passes < 2) { S.queue.push({ ...L.item }); L.result.back = true; }
  } else {
    const p = S.players[winner];
    p.budget -= L.price;
    p.picks.push({ title: L.item.title, sub: L.item.sub, price: L.price, value: L.item.value });
    L.result = { sold: true, winner, price: L.price };
    S.lastSold = { player: winner, slot: p.picks.length - 1 };
  }
  S.history.push({ title: L.item.title, winner, price: winner === null ? 0 : L.price });
  S.phase = "sold";
}

function nextLot() {
  S.pos++;
  S.lastSold = null;
  if (S.pos >= S.queue.length || !S.players.some(canStillBuy)) { S.phase = "end"; S.lot = null; return; }
  S.phase = "reveal";
}

/* ---------------- actions: local or online ---------------- */
// fn mutates S and returns false to cancel. Online, it runs against the
// room's latest state and the result is written back to the room.
let busy = false;
async function act(fn) {
  if (!NET) { if (fn() !== false) { save(); render(); } return; }
  if (busy) return;
  busy = true;
  const before = S;
  try {
    const snap = await NET.ref.get();
    if (!snap.exists) { toast("This room no longer exists."); return; }
    S = JSON.parse(JSON.stringify(snap.data().state));
    if (fn() === false) { render(); return; }
    render();
    await NET.ref.set({ state: S, updatedAt: Date.now() });
  } catch (e) {
    S = before; render();
    netError(e);
  } finally { busy = false; }
}

function netError(e) {
  const code = e && e.code;
  if (code === "invalid_argument") toast("Your account can't save moves in this game. Ask the person who shared it to invite you as an Editor.");
  else if (code === "quota_exceeded") toast("The game's storage is full. Start a new room later.");
  else if (code === "revoked") toast("Your access to this game changed. Reload to continue.");
  else toast("Couldn't reach the room. Check your connection and try again.");
}

/* ---------------- online rooms ---------------- */
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
const genCode = () => Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");

async function createRoom(setup, $err) {
  const db = await getDb();
  if (!db) { $err.textContent = "Online rooms only work when this game is opened in Claude while signed in."; return; }
  try {
    let code, ref;
    for (let i = 0; i < 6; i++) {
      code = genCode(); ref = db.doc("rooms/" + code);
      const snap = await ref.get();
      const old = snap.exists && (Date.now() - (snap.data().updatedAt || 0) > 24 * 3600e3);
      if (!snap.exists || old) break;
      code = null;
    }
    if (!code) { $err.textContent = "Couldn't find a free room code. Try again."; return; }
    const name = (setup.myName || "").trim() || "Host";
    const state = { phase: "lobby", code, host: ME, members: [{ id: ME, name }], setup: { ...setup, phase: undefined } };
    await ref.set({ state, updatedAt: Date.now() });
    enterRoom(code, state);
  } catch (e) {
    $err.textContent = e && e.code === "invalid_argument"
      ? "Your account can't create rooms in this game. Only the owner and people invited as Editors can."
      : "Couldn't create the room. Check your connection and try again.";
  }
}

async function joinRoom(code, name, $err) {
  code = (code || "").toUpperCase().replace(/[^A-Z]/g, "");
  if (code.length !== 4) { $err.textContent = "Room codes are 4 letters."; return; }
  if (!name.trim()) { $err.textContent = "Add your name so the others know who's bidding."; return; }
  const db = await getDb();
  if (!db) { $err.textContent = "Online rooms only work when this game is opened in Claude while signed in."; return; }
  const ref = db.doc("rooms/" + code);
  try {
    // A short lease stops two people joining at the same moment from overwriting each other.
    for (let i = 0; i < 8; i++) {
      const lease = await ref.acquire({ holder: ME, ttlMs: 1500 });
      if (lease.acquired) break;
      await sleep(400);
    }
    const snap = await ref.get();
    if (!snap.exists) { $err.textContent = `There's no room called ${code}. Check the code with the host.`; return; }
    const st = JSON.parse(JSON.stringify(snap.data().state));
    if (st.members.some(m => m.id === ME)) return enterRoom(code, st);
    if (st.phase !== "lobby") { $err.textContent = "That draft has already started. Ask the host to go back to the lobby."; return; }
    if (st.members.length >= 6) { $err.textContent = "That room is full. Six players is the limit."; return; }
    st.members.push({ id: ME, name: name.trim().slice(0, 20) });
    await ref.set({ state: st, updatedAt: Date.now() });
    enterRoom(code, st);
  } catch (e) {
    $err.textContent = e && e.code === "invalid_argument"
      ? "Your account can't join yet. Ask the person who shared this game to invite you as an Editor, using your email."
      : "Couldn't reach that room. Check your connection and try again.";
  }
}

async function enterRoom(code, initial) {
  const db = await getDb();
  if (!db) { lsSet(ROOM_KEY, null); NET = null; S = load() || defaultSetup(); if (S.phase !== "home") S = defaultSetup(); render(); toast("Online rooms only work when this game is opened in Claude."); return; }
  if (NET && NET.unsub) NET.unsub();
  lsSet(ROOM_KEY, code);
  NET = { code, ref: db.doc("rooms/" + code), unsub: null, slow: false };
  S = initial ? JSON.parse(JSON.stringify(initial)) : { phase: "connecting", code };
  render();
  NET.loadTimer = setTimeout(() => { if (NET) { NET.slow = true; if (S.phase === "connecting") render(); } }, 10000);
  const myNet = NET;
  NET.unsub = NET.ref.onSnapshot(snap => {
    if (NET !== myNet) return;
    if (!snap.metadata.fromCache) { clearTimeout(NET.loadTimer); NET.slow = false; }
    if (!snap.exists) { if (!snap.metadata.fromCache) { toast(`Room ${code} has closed.`); leaveRoom(true); } return; }
    S = JSON.parse(JSON.stringify(snap.data().state));
    render();
  }, e => { if (NET === myNet) { clearTimeout(NET.loadTimer); netError(e); } });
}

async function leaveRoom(silent) {
  const net = NET;
  if (net) {
    if (net.unsub) net.unsub();
    clearTimeout(net.loadTimer);
    // In the lobby, free your seat so the room list stays tidy.
    if (S && S.phase === "lobby" && isMember()) {
      try {
        const snap = await net.ref.get();
        if (snap.exists) {
          const st = JSON.parse(JSON.stringify(snap.data().state));
          st.members = st.members.filter(m => m.id !== ME);
          if (st.members.length) { if (st.host === ME) st.host = st.members[0].id; await net.ref.set({ state: st, updatedAt: Date.now() }); }
          else await net.ref.delete();
        }
      } catch (e) {}
    }
  }
  NET = null; lsSet(ROOM_KEY, null);
  if (P2P) { closePeers(); closePairing(); if (net) lsSet(mirrorKey(net.code), null); PN.code = null; PN.doc = null; PN.ver = 0; }
  const prev = load();
  S = Object.assign(defaultSetup(), prev && prev.phase === "setup" ? prev : {}, { phase: "home" });
  render();
}

/* ---------------- rendering ---------------- */
function render() {
  clearInterval(spinInterval);
  const inGame = !["home", "setup", "lobby", "connecting"].includes(S.phase);
  $restart.hidden = !inGame;
  $restart.textContent = confirmArmed ? $restart.textContent : (NET ? "Leave room" : "New game");
  if (S.phase === "home") return renderHome();
  if (S.phase === "setup") return renderSetup();
  if (S.phase === "connecting") return renderConnecting();
  if (S.phase === "lobby") return renderLobby();
  if (S.phase === "end") return renderEnd();
  renderTable();
}

function renderConnecting() {
  $app.innerHTML = `<section class="panel lobby">
    <span class="label">Room ${esc(S.code)}</span>
    <h2>${NET && NET.slow ? "Can't reach the room yet" : "Connecting…"}</h2>
    <p class="note">${NET && NET.slow ? "Still trying. Check your connection, or leave and join again with the code." : "Loading the latest moves."}</p>
    <div><button class="ghost" id="leaveBtn">Leave room</button></div>
  </section>`;
  document.getElementById("leaveBtn").onclick = () => leaveRoom();
}

function renderLobby() {
  const amHost = S.host === ME;
  const hostName = (S.members.find(m => m.id === S.host) || {}).name || "the host";
  const su = S.setup;
  const g = GENRES.find(x => x.id === su.genreId);
  const genreName = g.id === "custom" ? ((su.customName || "").trim() || "Custom list") : g.name;
  const member = isMember();
  $app.innerHTML = `
  <section class="panel lobby">
    <div class="lobby-top">
      <div>
        <span class="label">Room code</span>
        <div class="room-code mono" aria-label="Room code ${S.code.split("").join(" ")}">${esc(S.code)}</div>
      </div>
      <button class="ghost" id="copyCode">Copy code</button>
    </div>
    ${P2P ? p2pPanel() : ""}
    <p class="note" ${P2P ? "hidden" : ""}>${LOCAL && lanAddress() ? `On the other phone, open <b class="mono">${esc(lanAddress())}</b> on the same Wi-Fi and tap this room.` : `On the other phone, open this same game, tap <b>Join a room</b> and type the code.`}</p>
    <div class="field-row">
      <span class="label">In the room · ${S.members.length} of 6</span>
      <div class="in-room">
        ${S.members.map((m, i) => `<span class="chip" style="--pc:var(${PCOLORS[i]})"><i></i>${esc(m.name)}${m.id === ME ? " (you)" : ""}${m.id === S.host ? " · host" : ""}</span>`).join("")}
      </div>
    </div>
    <div class="field-row">
      <span class="label">Genre</span>
      ${amHost ? genreGrid(su.genreId, su.genreId === "custom") : `<b class="lobby-genre">${esc(genreName)}</b>`}
      <p class="note">${money(su.budget)} each · ${su.slots} slots · ${su.reserve ? "£1 kept back per empty slot" : "no money kept back"} · stats ${su.showStats ? "shown while bidding" : "hidden until the end"}</p>
    </div>
    ${!member ? `<p class="note">You're watching this room. Go back and join with the code to play.</p>` : ""}
    <div class="actions">
      ${amHost ? `<button class="primary" id="startOnline" ${S.members.length < 2 ? "disabled" : ""}>${S.members.length < 2 ? "Waiting for players to join" : "Start the draft"}</button>`
               : `<p class="note">Waiting for ${esc(hostName)} to start the draft.</p>`}
      <button class="ghost" id="leaveBtn">Leave room</button>
    </div>
  </section>`;
  document.getElementById("copyCode").onclick = async () => {
    try { await navigator.clipboard.writeText(S.code); toast("Code copied."); } catch (e) { toast(`The code is ${S.code}.`); }
  };
  document.getElementById("leaveBtn").onclick = () => leaveRoom();
  wireP2pPanel();
  if (amHost) {
    $app.querySelectorAll("[data-genre]").forEach(b => b.onclick = () => {
      const id = b.dataset.genre;
      act(() => { if (S.phase !== "lobby") return false; S.setup.genreId = id; });
    });
    const sb = document.getElementById("startOnline");
    if (sb) sb.onclick = () => act(() => { if (S.phase !== "lobby" || S.members.length < 2) return false; startGame(S.setup); });
  }
}

const total = p => p.picks.reduce((s, k) => s + (k.value || 0), 0);
function standings() {
  // highest total wins; a tie goes to whoever has more money left
  return S.players.map((p, i) => ({ i, total: total(p), left: p.budget }))
    .sort((a, b) => b.total - a.total || b.left - a.left);
}
function boardsHTML(final, ranking) {
  const showVals = S.stat && (final || S.showStats);
  const seat = mySeat();
  return `<section class="boards" aria-label="Draft boards">
    ${S.players.map((p, i) => {
      const leading = S.lot && S.lot.leader === i && S.phase === "auction";
      const place = ranking ? ranking.findIndex(r => r.i === i) : -1;
      return `<article class="board${place === 0 ? " champ" : ""}" style="--pc:var(${p.color})">
        <div class="board-head"><h3>${esc(p.name)}${i === seat ? ` <span class="you">you</span>` : ""}${place === 0 ? ` <span class="crown">Winner</span>` : ""}</h3><span class="wallet">${money(p.budget)}</span></div>
        <ol class="slots">
          ${Array.from({ length: S.slots }, (_, k) => {
            const pk = p.picks[k];
            const isNew = S.lastSold && S.lastSold.player === i && S.lastSold.slot === k;
            return pk ? `<li class="slot${isNew ? " new" : ""}"><span class="t">${esc(pk.title)}<small class="p">${money(pk.price)}</small></span><span class="v">${showVals ? fmtStat(pk.value, S.stat.fmt) : ""}</span></li>`
                      : `<li class="slot empty"><span class="t">Empty slot</span><span></span></li>`;
          }).join("")}
        </ol>
        ${showVals ? `<div class="board-total"><span class="label">${esc(S.stat.label)}</span><b class="mono">${fmtStat(total(p), S.stat.fmt)}</b></div>` : ""}
        <div class="board-foot"><span>${final ? `Spent ${money(S.budget - p.budget)}` : empty(p) ? `Max bid now ${money(Math.max(0, maxBid(p)))}` : "Draft complete"}</span>${leading ? `<span>Leading</span>` : ""}${place > 0 ? `<span>${ordinal(place + 1)} place</span>` : ""}</div>
      </article>`;
    }).join("")}
  </section>`;
}
const ordinal = n => n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");

function queueStrip() {
  const n = S.queue.length;
  return `<div class="queue-strip" aria-label="Lot ${S.pos + 1} of ${n}">
    ${S.queue.map((_, i) => `<span class="qdot ${i < S.pos ? "done" : i === S.pos ? "now" : ""}"></span>`).join("")}
    <span class="note" style="margin-left:6px">Lot ${Math.min(S.pos + 1, n)} of ${n}</span></div>`;
}

// The shuffle animation plays on every phone the first time it shows a new lot.
let shownLot = null, spinUntil = 0, spinInterval = null, lastPrice = null;
function renderTable() {
  const L = S.lot;
  const reveal = S.phase === "reveal";
  const item = reveal ? S.queue[S.pos] : L.item;
  const seat = mySeat();
  const local = !NET;

  const lotKey = reveal ? null : `${S.history.length}:${S.pos}:${item.title}`;
  if (lotKey && lotKey !== shownLot) {
    shownLot = lotKey;
    if (S.phase === "auction" && !L.log.some(l => l.includes("bids")) && !reduceMotion()) {
      spinUntil = Date.now() + 1400;
      setTimeout(() => { if (S.phase === "auction" || S.phase === "sold") render(); }, 1450);
    }
  }
  const spinning = Date.now() < spinUntil && S.phase === "auction";
  const bumped = !!(L && lastPrice && lastPrice.key === lotKey && L.price > lastPrice.price);
  lastPrice = L ? { key: lotKey, price: L.price } : null;

  let side = "";
  if (reveal) {
    side = `<section class="panel turn">
      <span class="label">Up next</span>
      <h2 style="font-size:22px">Lot ${S.pos + 1} is ready</h2>
      <p class="note">${local ? "Everyone look at the screen. " : ""}The bidding opens with ${esc(S.players[firstOpener()].name)}.</p>
      ${local || seat >= 0 ? `<button class="primary" id="revealBtn">Reveal the lot</button>` : ""}
    </section>`;
  } else if (S.phase === "auction") {
    const p = S.players[L.turn];
    const mb = maxBid(p);
    const mine = local || L.turn === seat;
    const steps = [1, 2, 5].map(s => L.price + s);
    const status = L.leader === null ? "No bids yet." : `${esc(S.players[L.leader].name)} leads at ${money(L.price)}.`;
    side = `<section class="panel turn" style="--pc:var(${p.color})">
      <div class="turn-who">
        <div class="paddle" aria-hidden="true"><span>${L.turn + 1}</span></div>
        <div>${mine
          ? `<h2>${local ? esc(p.name) + ", you're" : "You're"} up</h2><p>${status} ${L.leader === null ? "Open the bidding or drop out." : ""} You can go up to ${money(mb)}.</p>`
          : `<h2>${esc(p.name)} is deciding</h2><p>${status} Their phone shows the bid buttons.</p>`}</div>
      </div>
      ${mine ? `
      <div class="bid-btns">
        ${steps.map((v, k) => `<button class="bid-btn" data-bid="${v}" ${v > mb || spinning ? "disabled" : ""}>${money(v)}<small>+${[1, 2, 5][k]}</small></button>`).join("")}
      </div>
      <div class="custom-bid">
        <input type="number" id="customBid" min="${L.price + 1}" max="${mb}" placeholder="Other amount" aria-label="Custom bid amount">
        <button id="customBidBtn" ${spinning ? "disabled" : ""}>Bid</button>
      </div>
      <button class="drop-btn" id="dropBtn" ${spinning ? "disabled" : ""}>Drop out of this lot</button>` : `<div class="waiting" aria-hidden="true"><span></span><span></span><span></span></div>`}
      <div class="in-room">
        ${S.players.map((q, i) => {
          const out = !L.active.includes(i);
          return `<span class="chip ${out ? "out" : ""} ${L.leader === i ? "lead" : ""}" style="--pc:var(${q.color})"><i></i>${esc(q.name)}${i === seat ? " (you)" : ""}</span>`;
        }).join("")}
      </div>
      ${L.log.length ? `<ul class="log">${L.log.map(l => `<li>${l}</li>`).join("")}</ul>` : ""}
    </section>`;
  } else {
    const r = L.result;
    const last = S.pos + 1 >= S.queue.length || !S.players.some(canStillBuy);
    side = `<section class="panel turn">
      <span class="label">Hammer down</span>
      <h2 style="font-size:22px">${r.sold ? `${r.winner === seat ? "You take" : esc(S.players[r.winner].name) + " takes"} it for ${money(r.price)}` : "Nobody bid on this one"}</h2>
      <p class="note">${r.sold ? `That fills slot ${S.players[r.winner].picks.length} of ${S.slots}.` : r.back ? "It goes to the back of the pile for one more chance." : "It's out of the draft."}</p>
      ${L.log.length ? `<ul class="log">${L.log.map(l => `<li>${l}</li>`).join("")}</ul>` : ""}
      ${local || seat >= 0 ? `<button class="primary" id="nextBtn">${last ? "See the final drafts" : "Next lot"}</button>` : ""}
    </section>`;
  }

  const r = L && L.result;
  $app.innerHTML = `
  <div class="wrap" style="gap:20px">
    ${NET ? `<div class="room-bar"><span class="label">Room</span> <b class="mono">${esc(S.code)}</b>${seat >= 0 ? ` <span class="note">You're ${esc(S.players[seat].name)}</span>` : ` <span class="note">Watching</span>`}${P2P ? p2pPanel(true) : ""}</div>` : ""}
    <div class="stage">
      <section class="panel lot" aria-live="polite">
        <div class="lot-top"><span class="label">${esc(S.genre)}</span>${queueStrip()}</div>
        <div>
          <div class="lot-title ${reveal || spinning ? "spinning" : ""}" id="lotTitle">${reveal ? "?" : esc(item.title)}</div>
          <div class="lot-sub" id="lotSub">${reveal || spinning ? "Shuffling the pile…" : esc(item.sub || "")}</div>
          ${!reveal && !spinning && S.stat ? `<div class="lot-stat"><span class="label">${esc(S.stat.label)}</span> <b class="mono">${S.showStats ? fmtStat(item.value, S.stat.fmt) : "Hidden until the end"}</b></div>` : ""}
        </div>
        <div class="price-row">
          <div><div class="label">${S.phase === "sold" ? "Hammer price" : "Current bid"}</div>
            <div class="price ${bumped ? "bump" : ""}">${reveal ? "£–" : money(L.price)}</div></div>
          <div class="leader"><div class="label">${S.phase === "sold" ? "Winner" : "Leading"}</div>
            <b>${reveal ? "–" : L.leader === null ? "No bids" : esc(S.players[L.leader].name)}</b></div>
        </div>
        ${S.phase === "sold" ? `<div class="stamp ${r.sold ? "" : "unsold"}">${r.sold ? "SOLD" : "NO SALE"}</div>` : ""}
      </section>
      ${side}
    </div>
    ${boardsHTML()}
  </div>`;

  wireP2pPanel();
  if (spinning) {
    const el = document.getElementById("lotTitle");
    const pool = S.queue.map(x => x.title);
    spinInterval = setInterval(() => { el.textContent = pool[Math.floor(Math.random() * pool.length)]; }, 70);
  }

  const pos = S.pos;
  if (reveal) {
    const rb = document.getElementById("revealBtn");
    if (rb) rb.onclick = () => { rb.disabled = true; act(() => { if (S.phase !== "reveal" || S.pos !== pos) return false; openLot(); }); };
  } else if (S.phase === "auction") {
    const turnSeat = L.turn;
    const guarded = fn => act(() => { if (S.phase !== "auction" || S.pos !== pos || S.lot.turn !== turnSeat) return false; return fn(); });
    $app.querySelectorAll("[data-bid]").forEach(b => b.onclick = () => guarded(() => bid(+b.dataset.bid)));
    const db = document.getElementById("dropBtn");
    if (db) db.onclick = () => guarded(drop);
    const cb = document.getElementById("customBid");
    if (cb) {
      const go = () => { const v = parseInt(cb.value); if (v > L.price && v <= maxBid(S.players[L.turn])) guarded(() => bid(v)); else { cb.value = ""; cb.placeholder = `£${L.price + 1}–£${maxBid(S.players[L.turn])}`; cb.focus(); } };
      document.getElementById("customBidBtn").onclick = go;
      cb.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }
  } else {
    const nb = document.getElementById("nextBtn");
    if (nb) nb.onclick = () => { nb.disabled = true; act(() => { if (S.phase !== "sold" || S.pos !== pos) return false; nextLot(); }); };
  }
}

function renderEnd() {
  const ps = S.players;
  const spent = p => S.budget - p.budget;
  const allPicks = ps.flatMap(p => p.picks.map(k => ({ ...k, who: p.name })));
  const priciest = allPicks.slice().sort((a, b) => b.price - a.price)[0];
  const bargain = allPicks.filter(k => k.price > 0).sort((a, b) => a.price - b.price)[0];
  const unsold = S.history.filter(h => h.winner === null).map(h => h.title);
  const unsoldUnique = [...new Set(unsold)].filter(t => !allPicks.some(k => k.title === t));
  const canAct = !NET || isMember();
  let ranking = null, head;
  if (S.stat) {
    ranking = standings();
    const w = ranking[0], second = ranking[1];
    const tie = second && second.total === w.total;
    const wp = ps[w.i];
    head = `<span class="label">${esc(S.genre)} · most ${esc(S.stat.label.toLowerCase())} wins</span>
      <h2>${esc(wp.name)} wins with ${fmtStat(w.total, S.stat.fmt)}</h2>
      <p class="note">${second ? (tie
        ? `Level with ${esc(ps[second.i].name)} on ${fmtStat(second.total, S.stat.fmt)}, so it goes to money left: ${money(w.left)} to ${money(second.left)}.`
        : `${esc(ps[second.i].name)} finished on ${fmtStat(second.total, S.stat.fmt)}.`) : ""}</p>
      ${S.stat.source ? `<p class="source">Source: ${esc(S.stat.source)}</p>` : ""}`;
  } else if (S.vote != null) {
    ranking = [{ i: S.vote }];
    head = `<span class="label">${esc(S.genre)} · decided by vote</span>
      <h2>${esc(ps[S.vote].name)} wins the draft</h2>
      ${canAct ? `<p class="note">Changed your minds? <button class="ghost" id="revote">Vote again</button></p>` : ""}`;
  } else {
    head = `<span class="label">${esc(S.genre)} · final drafts</span>
      <h2>No stats for this list, so you decide. Who drafted best?</h2>
      ${canAct ? `<div class="actions">${ps.map((p, i) => `<button class="vote-btn" data-vote="${i}" style="--pc:var(${p.color})">${esc(p.name)}</button>`).join("")}</div>` : ""}`;
  }
  const valuePick = S.stat ? allPicks.filter(k => k.price > 0 && k.value != null).sort((a, b) => b.value / b.price - a.value / a.price)[0] : null;
  $app.innerHTML = `
  <div class="wrap" style="gap:20px">
    <section class="panel" style="display:grid;gap:18px">
      ${P2P && NET ? `<div class="room-bar">${p2pPanel(true)}</div>` : ""}
      <div class="results-head">${head}</div>
      <div class="awards">
        ${priciest ? `<div class="award"><span>Biggest spend</span><b>${esc(priciest.title)}</b><span>${esc(priciest.who)} paid ${money(priciest.price)}</span></div>` : ""}
        ${valuePick ? `<div class="award"><span>Best value for money</span><b>${esc(valuePick.title)}</b><span>${esc(valuePick.who)} got ${fmtStat(valuePick.value, S.stat.fmt)} for ${money(valuePick.price)}</span></div>`
          : bargain && bargain !== priciest ? `<div class="award"><span>Bargain of the night</span><b>${esc(bargain.title)}</b><span>${esc(bargain.who)} paid ${money(bargain.price)}</span></div>` : ""}
        <div class="award"><span>Money left on the table</span><b>${ps.map(p => `${esc(p.name)} ${money(p.budget)}`).join(" · ")}</b><span>Spent: ${ps.map(p => money(spent(p))).join(" vs ")}</span></div>
        ${unsoldUnique.length ? `<div class="award"><span>Nobody wanted</span><b>${unsoldUnique.map(esc).join(", ")}</b><span>Left unsold</span></div>` : ""}
      </div>
      ${canAct ? `<div class="actions">
        <button class="primary" id="againBtn">Rematch, same genre</button>
        <button class="ghost" id="newBtn" style="padding:14px 18px">${NET ? "Back to the lobby" : "Change genre or players"}</button>
      </div>` : ""}
    </section>
    ${boardsHTML(true, ranking)}
  </div>`;
  $app.querySelectorAll("[data-vote]").forEach(b => b.onclick = () => { const v = +b.dataset.vote; act(() => { if (S.phase !== "end") return false; S.vote = v; }); });
  const rv = document.getElementById("revote"); if (rv) rv.onclick = () => act(() => { if (S.phase !== "end") return false; S.vote = null; });
  wireP2pPanel();
  const again = document.getElementById("againBtn");
  if (again) again.onclick = () => act(() => { if (S.phase !== "end") return false; startGame(S.setup); });
  const nb = document.getElementById("newBtn");
  if (nb) nb.onclick = () => NET
    ? act(() => { if (S.phase !== "end") return false; S = { phase: "lobby", code: S.code, host: S.host, members: S.members, setup: S.setup }; })
    : toSetup();
}

function toSetup() {
  const prev = S && S.setup ? S.setup : null;
  S = Object.assign(defaultSetup(), prev || {}, { phase: "setup", mode: "local" });
  save(); render();
}

/* the header button needs a second tap to confirm, since dialogs don't show here */
let confirmArmed = false, armTimer;
$restart.onclick = () => {
  if (S.phase === "end" && !NET) return toSetup();
  if (!confirmArmed) {
    confirmArmed = true; $restart.textContent = NET ? "Tap again to leave" : "Tap again to abandon this draft"; clearTimeout(armTimer);
    armTimer = setTimeout(() => { confirmArmed = false; $restart.textContent = NET ? "Leave room" : "New game"; }, 3000); return;
  }
  confirmArmed = false; clearTimeout(armTimer);
  $restart.textContent = "New game";
  if (NET) leaveRoom(); else toSetup();
};

function start(data) {
  const room = (data && data.room) || lsGet(ROOM_KEY);
  getDb().then(db => { dbAvailable = !!db; if (S && S.phase === "home") render(); });
  if (LOCAL) { pollLan(); setInterval(() => { if (S && (S.phase === "home" || S.phase === "lobby")) pollLan(); }, 2000); }
  if (room) { S = { phase: "connecting", code: room }; enterRoom(room); return; }
  const restored = (data && data.S) || load();
  const ok = restored && ["home", "setup", "reveal", "auction", "sold", "end"].includes(restored.phase) && (restored.phase === "home" || restored.phase === "setup" || restored.players);
  S = ok ? restored : defaultSetup();
  if (S.phase === "setup" && S.mode === "host") S.mode = "host";
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S: NET ? null : S, room: NET ? NET.code : null }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
